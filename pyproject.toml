[project]
name = "sfm-from-scratch"
version = "0.1.0"
description = "Incremental Structure from Motion from scratch: OpenCV two-view geometry + PnP growth + SciPy sparse bundle adjustment, with pycolmap as reference and Rerun visualization."
requires-python = ">=3.10"
dependencies = [
    # Pinned to the 5.x line: the original ">=4.12" floated across a major version.
    # This project only uses main-module APIs (SIFT, BFMatcher, calib3d), so the
    # base package is enough; OpenCV 5 moved AKAZE/KAZE/BRISK to opencv_contrib.
    "opencv-python>=5.0.0,<6.0.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "click>=8.1",
    "loguru>=0.7",
    "tabulate>=0.9",
    "matplotlib>=3.8",
    "rerun-sdk>=0.33",
    "pycolmap>=3.11",
    "imageio[ffmpeg]>=2.34",
]

[project.scripts]
sfm-download = "sfm_from_scratch.cli.download:download"
sfm-run = "sfm_from_scratch.cli.run:run"
sfm-viz = "sfm_from_scratch.cli.viz:viz"
sfm-frames = "sfm_from_scratch.cli.frames:frames"
sfm-check = "sfm_from_scratch.cli.check:check"
sfm-figures = "sfm_from_scratch.cli.figures:figures"
sfm-webexport = "sfm_from_scratch.cli.webexport:webexport"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sfm_from_scratch"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]

[tool.ruff.lint.isort]
known-first-party = ["sfm_from_scratch"]
